<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <title>Expandable Report</title>
 <style>
   details { margin-left: 10px; }
   summary { cursor: pointer; font-weight: bold; }
   .day-details { margin-left: 20px; color: #333; }
 </style>
</head>
<body>
 <h1>Sales Report</h1>
 <details>
   <summary>2024</summary>
   <details>
     <summary>January</summary>
     <details>
       <summary>01 Jan</summary>
       <div class="day-details">Total Sales: $5000 | Orders: 120</div>
     </details>
     <details>
       <summary>02 Jan</summary>
       <div class="day-details">Total Sales: $4200 | Orders: 98</div>
     </details>
   </details>
   <details>
     <summary>February</summary>
     <details>
       <summary>01 Feb</summary>
       <div class="day-details">Total Sales: $3800 | Orders: 85</div>
     </details>
   </details>
 </details>
 <script>
 document.querySelectorAll("details").forEach((targetDetail) => {
 targetDetail.addEventListener("toggle", () => {
   if (targetDetail.open) {
     document.querySelectorAll("details").forEach((detail) => {
       if (detail !== targetDetail) detail.removeAttribute("open");
     });
   }
 });
});</script>
</body>
</html>
