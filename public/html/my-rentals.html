<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Миний профайл — RentFit</title>
  <script>(function(){var t=localStorage.getItem('rf_theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="stylesheet" href="/public/css/global.css">
  <link rel="stylesheet" href="/public/css/layout.css">
  <link rel="stylesheet" href="/public/css/styles.css">
  <link rel="stylesheet" href="/public/css/my-rentals.css">
</head>
<body>

  <app-navigation></app-navigation>

  <main class="page">
    <div class="profile-wrap">

      <!-- Profile Header -->
      <div class="profile-hd">
        <div class="profile-av" id="profile-av">?</div>
        <div class="profile-info">
          <div style="display:flex; align-items:center; gap:12px;">
            <h1 id="profile-name">Зочин</h1>
            <button class="notif-icon-btn" id="info-icon-btn" onclick="toggleInfoPopup()" title="Хувийн мэдээлэл">⚙️</button>
          </div>
          <p class="email" id="profile-email">—</p>
          <p class="meta" id="profile-meta">📞 — · 📍 Улаанбаатар</p>
        </div>
      </div>

      <!-- Stats -->
      <div class="profile-stats">
        <div class="p-stat"><div class="val" id="stat-active">0</div><div class="lbl">Идэвхтэй</div></div>
        <div class="p-stat"><div class="val" id="stat-total">0</div><div class="lbl">Нийт захиалга</div></div>
        <div class="p-stat"><div class="val" id="stat-listings">0</div><div class="lbl">Миний зар</div></div>
      </div>

      <!-- Tabs -->
      <div class="profile-tabs">
        <button class="ptab active" id="tab-notif" aria-controls="panel-notif">Мэдэгдэл <span class="notif-badge" id="notif-badge" hidden>0</span></button>
        <button class="ptab" id="tab-history" aria-controls="panel-history">Миний шүүгээ</button>
        <button class="ptab" id="tab-listings" aria-controls="panel-listings">Миний зарууд</button>
      </div>

      <!-- NOTIFICATIONS TAB -->
      <div id="panel-notif">
        <div class="profile-card">
          <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
            <h3>🔔 Таны мэдэгдлүүд</h3>
            <button class="btn-sm outline" onclick="markAllRead()">Бүгдийг уншсан болгох</button>
          </div>
          <div id="notif-popup-list"></div>
        </div>
      </div>

      <!-- HISTORY TAB (My Rentals) -->
      <div id="panel-history" hidden>
        <div class="profile-card">
          <h3>📦 Одоо түрээслэж байна</h3>
          <div id="active-list"></div>
        </div>
        <div class="profile-card" style="margin-top:16px">
          <h3>🕐 Өмнөх захиалгууд</h3>
          <div id="history-list"></div>
        </div>
      </div>

      <!-- LISTINGS TAB (My Listings) -->
      <div id="panel-listings" hidden>
        <div class="profile-card">
          <div style="display:flex; justify-content:space-between; margin-bottom:20px">
            <h3>👗 Миний түрээсийн зарууд</h3>
            <button class="btn-sm dark" id="btn-add-listing">+ Хувцас нэмэх</button>
          </div>
          <div id="publish-requests-section">
            <h4>⏳ Хүлээгдэж буй хүсэлтүүд</h4>
            <div id="publish-requests-list"></div>
          </div>
          <div class="listing-tabs">
            <button class="ltab active" data-status="all">Бүгд</button>
            <button class="ltab" data-status="pending">⏳ Хүлээгдэж буй</button>
            <button class="ltab" data-status="published">✅ Нийтлэгдсэн</button>
            <button class="ltab" data-status="rejected">❌ Буцаагдсан</button>
          </div>
          <div id="listings-list"></div>
        </div>

        <!-- Add Listing Form -->
        <div class="listing-add-card" id="listing-form-wrap" hidden>
          <h3>✨ Шинэ хувцас түрээслүүлэх</h3>
          <div class="form-group">
            <label>Зураг *</label>
            <div class="image-upload-area" id="image-upload-area">
              <div id="upload-placeholder">📷 Зураг оруулах</div>
              <img id="preview-image" style="display:none">
              <input type="file" id="listing-image-input" accept="image/*" style="display:none">
            </div>
          </div>
          <div class="form-group"><label>Хувцасны нэр *</label><input type="text" id="l-name"></div>
          <div class="form-group"><label>Брэнд *</label><input type="text" id="l-brand"></div>
          <div class="form-group"><label>Үнэ (₮) *</label><input type="number" id="l-price"></div>
          <div class="form-group"><label>Хэмжээ</label><input type="text" id="l-size"></div>
          <div class="form-group"><label>Тайлбар</label><textarea id="l-desc"></textarea></div>
          <div style="display:flex; gap:10px;">
            <button class="btn-g" id="btn-submit-listing">Илгээх</button>
            <button class="btn-sm outline" id="btn-cancel-listing">Болих</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Info Popup -->
  <div class="notif-popup" id="info-popup">
    <div class="notif-popup-header"><span>⚙️ Хувийн мэдээлэл</span><button onclick="closeInfoPopup()">✕</button></div>
    <div class="notif-popup-list" style="padding:16px;">
      <div class="profile-form">
        <div class="form-group"><label>Нэр</label><input type="text" id="inp-name"></div>
        <div class="form-group"><label>Имэйл</label><input type="email" id="inp-email"></div>
        <div class="form-group"><label>Утас</label><input type="tel" id="inp-phone"></div>
        <div class="form-group"><label>Хот</label><input type="text" id="inp-city" value="Улаанбаатар"></div>
        <button class="btn-sm dark" style="width:100%;" onclick="showToast('Мэдээлэл хадгалагдлаа ✓','green')">Хадгалах</button>
      </div>
    </div>
  </div>
  <div class="notif-overlay" id="info-overlay" onclick="closeInfoPopup()"></div>

  <!-- Review Modal -->
  <div class="modal-ov" id="review-modal">
    <div class="modal-card">
      <button class="modal-x" onclick="closeReviewModal()">✕</button>
      <h3>★ Сэтгэгдэл бичих</h3>
      <div class="star-row">
        <button class="star-btn">★</button><button class="star-btn">★</button><button class="star-btn">★</button><button class="star-btn">★</button><button class="star-btn">★</button>
      </div>
      <div class="form-group"><label>Сэтгэгдэл</label><textarea id="review-comment"></textarea></div>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn-g" onclick="submitReview()">Илгээх</button>
        <button class="btn-sm outline" onclick="closeReviewModal()">Болих</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <rent-footer></rent-footer>

  <script src="/public/js/my-rentals.js"></script>
  <script src="/public/js/theme.js"></script>
  <script type="module" src="/public/js/auth.js"></script>
  <script type="module" src="/public/wc/index.js"></script>
  <script type="module" src="/public/wc/navigation.js"></script>
</body>
</html>
